# --- unanswerable: four distinct failure modes, not just one repeated ---

- id: q29_out_of_domain
  # Not pesticide guidance at all.
  question: วิธีต้มส้มตำให้อร่อยทำอย่างไร
  answerable: false
  expect_contains: null
  expect_section: null

- id: q30_fabricated_active_ingredient
  # On-topic but the chemical does not exist in this corpus (or, as far as
  # this project knows, in reality) -- a dense-only retriever is more
  # likely to return a plausible-looking but wrong table for this than for
  # an off-domain question.
  question: ใช้ไซโคลฟอสมิน (fictional) กำจัดโรคพืชได้อัตราเท่าไหร่
  answerable: false
  expect_contains: null
  expect_section: null

- id: q31_crop_absent_from_corpus
  # Verified absent: zero chunks contain "อะโวคาโด" or "Avocado" anywhere
  # in the active corpus, in either script.
  question: โรคใบจุดในอะโวคาโดใช้สารอะไรป้องกัน
  answerable: false
  expect_contains: null
  expect_section: null

- id: q32_real_pest_wrong_crop_mango_leafhopper_in_durian
  # Both terms are real and both are indexed (q04's mango leafhopper, and
  # durian is its own section) -- the mismatch is that this specific
  # pest-crop pairing has no support anywhere in the corpus. Hardest
  # failure mode: on-topic, both entities exist, dense similarity to q04's
  # answer is high.
  question: เพลี้ยจักจั่นมะม่วงในทุเรียนใช้สารอะไรกำจัด
  answerable: false
  expect_contains: null
  expect_section: null

- id: q33_real_pest_wrong_crop_coffee_borer_in_mango
  # The twin of q32, swapped: a real pest (q07's coffee berry borer) asked
  # about a different real crop (mango) it has no table entry under.
  question: มอดเจาะผลกาแฟในมะม่วงใช้สารอะไรกำจัด
  answerable: false
  expect_contains: null
  expect_section: null

- id: q34_superseded_soybean_stinkbug
  # Supersession, not absence: the 2565 edition's soybean table carried a
  # stink bug entry (Nezara viridula, misspelled "Nezera" in the source
  # PDF) that the active 2568 edition's soybean section does not -- checked
  # directly (zero hits for "Nezara"/"stink"/"มวนเขียว"/"Riptortus" in the
  # active corpus's soybean section). This is the negative that actually
  # tests the project's premise: a question the system used to be able to
  # answer, and correctly can no longer.
  question: มวนเขียวในถั่วเหลืองใช้สารอะไรกำจัด
  answerable: false
  expect_contains: null
  expect_section: null
