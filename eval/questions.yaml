# Gold set for query/retrieve.py + query/rerank.py, run against the real
# local corpus (Docker, 2565/2566 archived, 2568 active - see PROMPT.md).
# Not synthetic: every expect_contains string below was confirmed present in
# an actual chunk of that corpus by direct query before being written here
# (see the session notes / KNOWLEDGE.md), not invented from memory of the
# PDFs.
#
# Fields:
#   id               short, stable across edits so a regression is easy to name
#   question         Thai, as a user would type it
#   answerable       true = a passage should exist; false = correct behaviour
#                     is rerank() returning [] (invariant 11's refusal).
#   expect_contains  substring that must appear in at least one of the top-k
#                     reranked passages for the question to score as a hit.
#                     Table cells are joined with literal "<br>" markers
#                     (see extract.py's _to_markdown()), so a two-word Latin
#                     binomial like "Genus species" is usually split across
#                     one in the raw text -- run_eval.py normalizes "<br>" to
#                     a space before checking, so write the substring as it
#                     reads, not as it's stored.
#   expect_section   the crop heading the right table sits under, or null.
#                     Checked on the SAME passage that satisfied
#                     expect_contains, not on the top rank alone: several
#                     active ingredients and pathogen genera in this corpus
#                     repeat across 6+ crop sections (measured: prochloraz,
#                     Colletotrichum), so a contains-only check would score
#                     "found some fungicide table" as a hit.
#   k                cutoff for recall@k on this question. Unused for now --
#                     run_eval.py scores at rerank.py's real TOP_K.

# --- answerable: Latin-binomial facts, each confirmed unique to one section
# across the whole active corpus (see the extraction script in session notes)
# ---

