[project]
name = "rag-production"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BBUNCH01", email = "buranon.b.d5-a@thaiairways.com" }
]
requires-python = ">=3.13"

dependencies = [
  "langchain-core",
  "langchain-postgres",
  "langchain-text-splitters",
  "langchain-community",
  "langchain-google-vertexai",
  "pymupdf",
  "pythainlp",
  "psycopg[binary,pool]",
  "sqlalchemy",
  "pgvector",
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "structlog",
  "tenacity",
  "langsmith",
  "psycopg2>=2.9.12",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy", "testcontainers[postgres]"]

[project.scripts]
rag-production = "rag_production:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"
