[project]
name = "rag-production"
version = "0.1.0"
description = "RAG over Thai DOA pesticide guidance handbooks"
readme = "README.md"
authors = [
    { name = "BBUNCH01", email = "buranon.b.d5-a@thaiairways.com" }
]
requires-python = ">=3.13"

dependencies = [
  # langchain-* pinned exact: PGVector was deprecated for PGVectorStore once
  # already, and a minor bump can move the retrieval surface underneath us.
  "langchain-core==1.6.2",
  "langchain-postgres==0.0.17",
  "langchain-text-splitters==1.1.2",
  "pymupdf>=1.28.2",
  "pythainlp>=5.3.7",
  "psycopg[binary,pool]>=3.3.5",
  "sqlalchemy>=2.0.52",
  "pgvector>=0.3.6",
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "tenacity",
  "openai>=3.11.0",
  "python-dotenv>=1.2.3",
  "pyyaml>=6.0.3",
  # query/rerank.py's scorer: raw HTTP to OpenRouter's Cohere-compatible
  # /api/v1/rerank, which the openai SDK client has no typed method for.
  "requests>=2.32.3",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy", "testcontainers[postgres]"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "requires_source_pdfs: needs data/raw/*.pdf, which are gitignored and absent in CI",
  "requires_embeddings: needs OPENROUTER_API_KEY, which CI does not have",
  "requires_rerank: needs OPENROUTER_API_KEY and hits the live rerank endpoint",
  "requires_llm: needs OPENROUTER_API_KEY and hits the live chat endpoint",
]
