[project]
name = "rag-production"
version = "0.1.0"
description = "RAG over Thai DOA pesticide guidance handbooks"
readme = "README.md"
authors = [
    { name = "BBUNCH01", email = "buranon.b.d5-a@thaiairways.com" }
]
requires-python = ">=3.13"

dependencies = [
  # langchain-* pinned exact: PGVector was deprecated for PGVectorStore once
  # already, and a minor bump can move the retrieval surface underneath us.
  "langchain-core==1.6.2",
  "langchain-postgres==0.0.17",
  "langchain-text-splitters==1.1.2",
  "langchain-ollama==1.1.0",
  "langchain-community==0.4.2",
  "langchain-google-vertexai==3.2.4",
  "pymupdf>=1.28.2",
  "pythainlp>=5.3.7",
  "psycopg[binary,pool]>=3.3.5",
  "sqlalchemy>=2.0.52",
  "pgvector>=0.3.6",
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "structlog",
  "tenacity",
  "langsmith",
  "openai>=3.11.0",
  "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy", "testcontainers[postgres]"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "requires_source_pdfs: needs data/raw/*.pdf, which are gitignored and absent in CI",
  "requires_embeddings: needs OPENROUTER_API_KEY, which CI does not have",
] 
