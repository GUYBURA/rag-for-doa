name: test

on:
    push:
        branches: [main]
    pull_request:

jobs:
    pytest:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: astral-sh/setup-uv@v5
              with:
                enable-cache: true
            
            - run: uv sync --frozen

            - run: uv run pytest -m "not requires_source_pdfs and not requires_embeddings and not requires_rerank" -q